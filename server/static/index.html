<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cam to Drone · Κέντρο ελέγχου</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- login -->
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="brand big"><i></i>Cam to Drone</div>
    <p class="mut">Κέντρο ελέγχου συναγερμών και drones</p>
    <label for="lu">Χρήστης</label><input id="lu" autocomplete="username" required>
    <label for="lp">Κωδικός</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr"></div>
    <button class="btn pri wide" type="submit">Σύνδεση</button>
  </form>
</div>

<!-- app -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand"><i></i>Cam to Drone</div>
    <nav class="tabs" id="nav">
      <button data-view="console" class="on">Κονσόλα</button>
      <button data-view="admin" id="navAdmin">Διαχείριση</button>
    </nav>
    <div class="stats" id="stats"></div>
    <div class="sp"></div>
    <button class="btn sm ghost" id="demoBtn" title="Δημιουργεί δοκιμαστικό συναγερμό σε τυχαία επιχείρηση">+ Δοκιμαστικός συναγερμός</button>
    <button class="btn sm ghost" id="soundBtn">🔇 Ήχος</button>
    <span class="clock" id="clock"></span>
    <div class="user" id="userBox"><button class="avatar" id="avatar"></button>
      <div class="menu" id="userMenu" hidden>
        <div class="mut" id="userName"></div>
        <button id="pwBtn">Αλλαγή κωδικού</button>
        <button id="logoutBtn">Αποσύνδεση</button>
      </div>
    </div>
  </header>

  <main id="console" class="grid3">
    <!-- queue -->
    <section class="pane queue">
      <div class="pane-h">
        <h2>Περιστατικά</h2>
        <select id="orgFilter" aria-label="Φίλτρο επιχείρησης"><option value="">Όλες οι επιχειρήσεις</option></select>
      </div>
      <div class="chips" id="qFilters">
        <button class="chip on" data-f="open">Ανοιχτά</button>
        <button class="chip" data-f="high">Υψηλή</button>
        <button class="chip" data-f="drone">Drone</button>
        <button class="chip" data-f="closed">Κλειστά</button>
      </div>
      <div class="list" id="queue"></div>
    </section>

    <!-- center -->
    <section class="center">
      <div class="media-row">
        <div class="pane media">
          <div class="pane-h"><h2>Κάμερα</h2><span class="mut" id="camTitle"></span></div>
          <div class="viewer" id="camView"><div class="empty">Επιλέξτε περιστατικό</div></div>
          <div class="thumbs" id="camThumbs"></div>
        </div>
        <div class="pane media">
          <div class="pane-h"><h2>Drone</h2><span class="mut" id="droneTitle"></span></div>
          <div class="viewer drone" id="droneView"><div class="empty">Κανένα drone σε αποστολή</div></div>
          <div class="drone-bar" id="droneBar"></div>
        </div>
      </div>
      <div class="pane mapwrap"><div id="map"></div><div class="map-legend" id="legend"></div></div>
    </section>

    <!-- right -->
    <section class="pane side" id="side"></section>
  </main>

  <main id="admin" class="admin" hidden></main>
</div>

<div id="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
