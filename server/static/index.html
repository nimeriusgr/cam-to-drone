<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SKYWARDEN · Κέντρο ελέγχου</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<!-- login -->
<div id="login" class="login" hidden>
  <div class="login-hero">
    <div class="login-copy">
      <div class="brand big">SKYWARDEN</div>
      <p class="tagline">Alarm to drone.</p>
      <p class="lead">Κάμερες, ελεγκτής και drone επιτήρησης σε μία οθόνη.</p>
    </div>
  </div>
  <div class="login-side">
    <form id="loginForm" class="login-card">
      <h1>Σύνδεση</h1>
      <p class="mut">Κέντρο ελέγχου συναγερμών</p>
      <label for="lu">Χρήστης</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="lp">Κωδικός</label><input id="lp" type="password" autocomplete="current-password" required>
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn pri wide" type="submit">Σύνδεση</button>
      <p class="fine">Πρόσβαση μόνο για εξουσιοδοτημένους χρήστες. Κάθε ενέργεια καταγράφεται.</p>
    </form>
  </div>
</div>

<!-- app -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand">SKYWARDEN</div>
    <nav class="tabs" id="nav">
      <button data-view="console" class="on" id="navConsole">Κονσόλα</button>
      <button data-view="cust" id="navCust" hidden>Συναγερμοί</button>
      <button data-view="reports" id="navReports">Αναφορές</button>
      <button data-view="admin" id="navAdmin">Διαχείριση</button>
    </nav>
    <div class="stats" id="stats"></div>
    <div class="sp"></div>
    <button class="btn sm ghost" id="shiftBtn" hidden>Βάρδια</button>
    <button class="btn sm ghost" id="demoBtn" title="Δημιουργεί δοκιμαστικό συναγερμό σε τυχαία επιχείρηση">+ Δοκιμαστικός συναγερμός</button>
    <button class="btn sm ghost" id="soundBtn">🔇 Ήχος</button>
    <span class="clock" id="clock"></span>
    <div class="user" id="userBox"><button class="avatar" id="avatar"></button>
      <div class="menu" id="userMenu" hidden>
        <div class="mut" id="userName"></div>
        <button id="pushBtn">Ειδοποιήσεις σε αυτή τη συσκευή</button>
        <button id="pwBtn">Αλλαγή κωδικού</button>
        <button id="logoutBtn">Αποσύνδεση</button>
      </div>
    </div>
  </header>

  <main id="console" class="grid3">
    <!-- queue -->
    <section class="pane queue">
      <div class="pane-h">
        <h2>Περιστατικά</h2>
        <select id="orgFilter" aria-label="Φίλτρο επιχείρησης"><option value="">Όλες οι επιχειρήσεις</option></select>
      </div>
      <div class="chips" id="qFilters">
        <button class="chip on" data-f="open">Ανοιχτά</button>
        <button class="chip" data-f="high">Υψηλή</button>
        <button class="chip" data-f="mine">Δικά μου</button>
        <button class="chip" data-f="drone">Drone</button>
        <button class="chip" data-f="closed">Κλειστά</button>
      </div>
      <div class="list" id="queue"></div>
    </section>

    <!-- center -->
    <section class="center">
      <div class="media-row">
        <div class="pane media">
          <div class="pane-h"><h2>Κάμερα</h2><span class="mut" id="camTitle"></span></div>
          <div class="viewer" id="camView"><div class="empty">Επιλέξτε περιστατικό</div></div>
          <div class="thumbs" id="camThumbs"></div>
        </div>
        <div class="pane media">
          <div class="pane-h"><h2>Drone</h2><span class="mut" id="droneTitle"></span></div>
          <div class="viewer drone" id="droneView"><div class="empty">Κανένα drone σε αποστολή</div></div>
          <div class="drone-bar" id="droneBar"></div>
        </div>
      </div>
      <div class="pane mapwrap"><div id="map"></div><div class="map-legend" id="legend"></div></div>
    </section>

    <!-- right -->
    <section class="pane side" id="side"></section>
  </main>

  <main id="admin" class="admin" hidden></main>
  <main id="reports" class="reports" hidden></main>
  <main id="cust" class="cust" hidden></main>
</div>

<div id="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
<script src="/static/features.js"></script>
</body>
</html>
