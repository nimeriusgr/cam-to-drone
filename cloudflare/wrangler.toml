name = "cam2drone"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

[vars]
SIM_SPEED = "1"

[[d1_databases]]
binding = "DB"
database_name = "cam2drone"
database_id = "145220d2-62a0-4d10-935e-a34ffb53a55c"

# media (images, voice messages, alarm clips). Without this binding images go into D1 and clips are disabled.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cam2drone-media"

# Pilot: deploys with --branch pilot (https://pilot.cam2drone.pages.dev) use their own database and storage,
# so new versions can be tried without touching the live data.
[env.preview]
vars = { SIM_SPEED = "1" }

[[env.preview.d1_databases]]
binding = "DB"
database_name = "cam2drone-pilot"
database_id = "c38d1b7f-528e-4703-9eb8-eeb13211bd4e"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "cam2drone-pilot-media"
