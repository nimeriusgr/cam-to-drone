name = "skywarden-cron"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
crons = ["* * * * *"]

[vars]
SITE_ORIGIN = "https://cam2drone.pages.dev"
SIM_SPEED = "1"

[[d1_databases]]
binding = "DB"
database_name = "cam2drone"
database_id = "145220d2-62a0-4d10-935e-a34ffb53a55c"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cam2drone-media"
